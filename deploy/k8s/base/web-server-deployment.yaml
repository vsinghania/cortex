apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: cortex
  labels:
    app: web-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web-server
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web-server
          image: cortex:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/web-server/server.js"]
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: cortex-config
            - secretRef:
                name: cortex-secrets
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/db
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
