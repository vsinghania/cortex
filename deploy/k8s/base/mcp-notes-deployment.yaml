apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-notes
  namespace: cortex
  labels:
    app: mcp-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-notes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mcp-notes
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mcp-notes
          image: cortex:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/mcp/server/notes/server.js"]
          env:
            - name: PORT
              value: "3010"
            - name: MCP_NOTES_HOST
              value: "0.0.0.0"
          envFrom:
            - configMapRef:
                name: cortex-config
            - secretRef:
                name: cortex-secrets
          ports:
            - name: http
              containerPort: 3010
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
