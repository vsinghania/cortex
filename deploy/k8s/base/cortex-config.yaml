apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
  namespace: cortex
data:
  LOG_LEVEL: info
  MONGO_HOST: mongodb
  MONGO_PORT: "27017"
  MONGO_DB_APP: cortex
  CORS_ORIGINS: http://localhost:3000
  ACCESS_TOKEN_TTL_SEC: "900"
  REFRESH_TOKEN_TTL_SEC: "604800"
  REFRESH_COOKIE_NAME: rt
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: lax
  AUTH_RATE_LIMIT_WINDOW_MS: "900000"
  AUTH_RATE_LIMIT_MAX: "60"
  BCRYPT_SALT_ROUNDS: "12"
  OPENAI_DEFAULT_MODEL: gpt-4o-mini
  MCP_NOTES_HOST: mcp-notes
  MCP_NOTES_PORT: "3010"
  MCP_NOTES_PATH: /mcp
