# Docker's json-file driver never rotates by default. On a 30 GB root volume
# holding the Mongo and Qdrant data too, unbounded per-request logs are the
# most likely way this instance runs out of disk.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    # Pinned by digest, not by tag: `mongo:7` moves on every 7.x patch, and a
    # `docker compose pull` that re-resolved it would change this service's
    # config hash and recreate the database as a side effect of an app deploy.
    # Digest taken from the running container on 2026-09-06.
    image: mongo@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    restart: unless-stopped
    logging: *default_logging
    volumes:
      - mongodb_data:/data/db
    # Published on the instance's loopback ONLY, for remote access via an SSM
    # port-forward (see deploy/aws.md "Connecting to the prod database"). Mongo
    # runs without auth, so 0.0.0.0 here or a port 27017 rule in cortex-ec2-sg
    # would put the whole database on the public internet. Never do either.
    ports:
    - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    # Pinned by digest — see the note on mongodb above. `qdrant/qdrant:latest`
    # moved on every upstream release, which on a box with one copy of the
    # vectors is the more dangerous of the two.
    # Digest taken from the running container on 2026-09-06.
    image: qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    restart: unless-stopped
    logging: *default_logging
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web-server:
    image: ${CORTEX_IMAGE:?CORTEX_IMAGE is required}
    command: ["node", "--enable-source-maps", "dist/web-server/server.js"]
    restart: unless-stopped
    logging: *default_logging

    # The job worker runs in this process and drains on SIGTERM: it stops
    # claiming, flushes each in-flight job's checkpoint, and releases its lease so
    # the next container resumes immediately instead of waiting out the lease.
    # Compose's default grace period is 10s, which would SIGKILL that drain
    # halfway through on every deploy. 30s leaves room for the worker's own 25s
    # deadline (JOBS_DRAIN_DEADLINE_MS) and the 28s forced exit behind it.
    stop_grace_period: 30s

    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp-notes:
        condition: service_started

    environment:
      PORT: "3000"
      LOG_LEVEL: info

      # One hop: the public ALB.
      TRUST_PROXY_HOPS: "1"

      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB_APP: cortex

      CORS_ORIGINS: https://cortexapp.me

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      ACCESS_TOKEN_TTL_SEC: "900"
      REFRESH_TOKEN_TTL_SEC: "604800"
      REFRESH_COOKIE_NAME: rt
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax

      AUTH_RATE_LIMIT_WINDOW_MS: "900000"
      AUTH_RATE_LIMIT_MAX: "60"
      BCRYPT_SALT_ROUNDS: "12"

      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_DEFAULT_MODEL: gpt-5.4-nano
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_DEFAULT_MODEL: claude-haiku-4-5

      QDRANT_URL: http://qdrant:6333
      RAG_TOP_K: "8"
      CHUNK_TARGET_TOKENS: "512"
      CHUNK_OVERLAP_TOKENS: "64"

      MCP_NOTES_HOST: mcp-notes
      MCP_NOTES_PORT: "3010"
      MCP_NOTES_PATH: /mcp
      MCP_NOTES_AUTH_TOKEN: ${MCP_NOTES_AUTH_TOKEN:?MCP_NOTES_AUTH_TOKEN is required}
      MCP_NOTES_INTERNAL_URL: http://mcp-notes:3010/mcp

      VOICE_PROVIDER: openai
      OPENAI_REALTIME_MODEL: gpt-realtime
      OPENAI_REALTIME_VOICE: alloy
      VOICE_MCP_PUBLIC_URL: https://api.cortexapp.me/api/v1/mcp/notes

      # Resend over SMTP; SMTP_PASS is a sending-only API key. MAIL_FROM must stay
      # on the domain verified in Resend - any other is refused with a 5xx, which
      # the mailer treats as permanent, so the send job fails without retrying.
      MAIL_TRANSPORT: smtp
      MAIL_FROM: "Cortex <no-reply@mail.cortexapp.me>"
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: resend
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      # Origin that links in emails point to (the SPA, not this API).
      APP_PUBLIC_URL: https://cortexapp.me

    ports:
    - "3000:3000"

  mcp-notes:
    image: ${CORTEX_IMAGE:?CORTEX_IMAGE is required}
    command: ["node", "--enable-source-maps", "dist/mcp/server/notes/server.js"]
    restart: unless-stopped
    logging: *default_logging

    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started

    environment:
      PORT: "3010"
      LOG_LEVEL: info

      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB_APP: cortex

      MCP_NOTES_HOST: 0.0.0.0
      MCP_NOTES_PORT: "3010"
      MCP_NOTES_PATH: /mcp
      MCP_NOTES_AUTH_TOKEN: ${MCP_NOTES_AUTH_TOKEN:?MCP_NOTES_AUTH_TOKEN is required}

      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      QDRANT_URL: http://qdrant:6333
    # Reachable only over the Docker network (web-server proxies to it) and from
    # the instance itself via SSM. Never publish on 0.0.0.0 — the EC2 security
    # group would then be the only thing keeping mcp-notes off the internet.
    ports:
    - "127.0.0.1:3010:3010"

volumes:
  mongodb_data:
  qdrant_data: