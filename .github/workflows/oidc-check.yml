# Throwaway verification workflow. Proves the OIDC trust policies, the branch
# pin, the repo variables and the deploy role's lookups all work — without
# touching ECR, S3, CloudFront or the running stack. Delete once it passes.
name: oidc-check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  variables:
    runs-on: ubuntu-latest
    steps:
      - name: All nine repo variables are set
        run: |
          fail=0
          check() {
            if [ -z "$2" ]; then echo "::error::variable $1 is empty or unset"; fail=1
            else printf '%-28s = %s\n' "$1" "$2"; fi
          }
          check AWS_REGION                 "${{ vars.AWS_REGION }}"
          check AWS_ACCOUNT_ID             "${{ vars.AWS_ACCOUNT_ID }}"
          check ECR_REPO                   "${{ vars.ECR_REPO }}"
          check EC2_NAME_TAG               "${{ vars.EC2_NAME_TAG }}"
          check SPA_BUCKET                 "${{ vars.SPA_BUCKET }}"
          check CLOUDFRONT_DISTRIBUTION_ID "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          check DEPLOY_BUCKET              "${{ vars.DEPLOY_BUCKET }}"
          check AWS_ROLE_BUILD             "${{ vars.AWS_ROLE_BUILD }}"
          check AWS_ROLE_DEPLOY            "${{ vars.AWS_ROLE_DEPLOY }}"
          exit $fail

  build-role:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_BUILD }}
          role-session-name: oidc-check-build-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      # Probe only actions the build role is actually granted: the account-wide
      # auth token, and DescribeImages scoped to the cortex-app repository.
      - name: Registry auth works
        run: aws ecr get-login-password > /dev/null && echo "got a registry token"

      - name: Scoped repository permission works
        run: |
          aws ecr describe-images --repository-name "${{ vars.ECR_REPO }}" \
            --query 'length(imageDetails)' --output text

  deploy-role:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY }}
          role-session-name: oidc-check-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      - name: Instance lookup (same query deploy-api will use)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.EC2_NAME_TAG }}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)

          if [ "$(printf '%s' "$INSTANCE_ID" | wc -w)" -ne 1 ]; then
            echo "::error::expected exactly one running instance tagged ${{ vars.EC2_NAME_TAG }}, got '$INSTANCE_ID'"
            exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "instance: $INSTANCE_ID"

      - name: SSM agent is online
        run: |
          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text)
          echo "ping status: $STATUS"
          [ "$STATUS" = "Online" ] || { echo "::error::SSM agent not Online"; exit 1; }

      - name: ECR read permission works
        run: |
          aws ecr describe-images --repository-name "${{ vars.ECR_REPO }}" \
            --query 'length(imageDetails)' --output text
