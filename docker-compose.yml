services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Local mail catcher: accepts any SMTP message and shows it at
  # http://localhost:8025. Nothing it receives leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # Otherwise every connection waits ~8s on a reverse lookup of the Docker
      # gateway IP before the SMTP banner.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "1025:1025"
      - "8025:8025"

  web-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cortex:dev
    # Matches deploy/docker-compose.prod.yml: in-flight requests (streamed agent
    # replies) get longer than Compose's 10s default to finish.
    stop_grace_period: 30s
    command: ["node", "--enable-source-maps", "dist/web-server/server.js"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp-notes:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      PORT: "3000"
      LOG_LEVEL: info
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB_APP: cortex
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_secret_change_me}
      ACCESS_TOKEN_TTL_SEC: "900"
      REFRESH_TOKEN_TTL_SEC: "604800"
      REFRESH_COOKIE_NAME: rt
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      AUTH_RATE_LIMIT_WINDOW_MS: "900000"
      AUTH_RATE_LIMIT_MAX: "60"
      BCRYPT_SALT_ROUNDS: "12"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DEFAULT_MODEL: gpt-5.4-nano
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_DEFAULT_MODEL: claude-haiku-4-5
      QDRANT_URL: http://qdrant:6333
      RAG_TOP_K: "8"
      CHUNK_TARGET_TOKENS: "512"
      CHUNK_OVERLAP_TOKENS: "64"
      MCP_NOTES_HOST: mcp-notes
      MCP_NOTES_PORT: "3010"
      MCP_NOTES_PATH: /mcp
      MCP_NOTES_AUTH_TOKEN: ${MCP_NOTES_AUTH_TOKEN:-dev_mcp_notes_token_change_me}
      MCP_NOTES_INTERNAL_URL: http://mcp-notes:3010/mcp
      VOICE_PROVIDER: ${VOICE_PROVIDER:-openai}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-alloy}
      VOICE_MCP_PUBLIC_URL: ${VOICE_MCP_PUBLIC_URL:-}
      MAIL_TRANSPORT: smtp
      MAIL_FROM: "Cortex <no-reply@cortexapp.me>"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      APP_PUBLIC_URL: http://localhost:5173
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3000/api/v1/auth/google/callback
      SECRET_ENCRYPTION_KEYS: ${SECRET_ENCRYPTION_KEYS:-}
      SECRET_ENCRYPTION_ACTIVE_KEY_ID: ${SECRET_ENCRYPTION_ACTIVE_KEY_ID:-}
      MS_OAUTH_CLIENT_ID: ${MS_OAUTH_CLIENT_ID:-}
      MS_OAUTH_CLIENT_SECRET: ${MS_OAUTH_CLIENT_SECRET:-}
      MS_OAUTH_REDIRECT_URI: http://localhost:3000/api/v1/integrations/onenote/callback
    ports:
      - "3000:3000"

  # Runs queued jobs. No ports: it only talks to Mongo, Qdrant, SMTP and the
  # provider APIs. Recurring schedules are ticked by web-server.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cortex:dev
    command: ["node", "--enable-source-maps", "dist/worker/worker.js"]
    restart: unless-stopped
    # The drain on SIGTERM flushes checkpoints and releases leases; Compose's 10s
    # default would SIGKILL it halfway. See deploy/docker-compose.prod.yml.
    stop_grace_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      LOG_LEVEL: info
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB_APP: cortex
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      QDRANT_URL: http://qdrant:6333
      CHUNK_TARGET_TOKENS: "512"
      CHUNK_OVERLAP_TOKENS: "64"
      MAIL_TRANSPORT: smtp
      MAIL_FROM: "Cortex <no-reply@cortexapp.me>"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      APP_PUBLIC_URL: http://localhost:5173
      SECRET_ENCRYPTION_KEYS: ${SECRET_ENCRYPTION_KEYS:-}
      SECRET_ENCRYPTION_ACTIVE_KEY_ID: ${SECRET_ENCRYPTION_ACTIVE_KEY_ID:-}
      MS_OAUTH_CLIENT_ID: ${MS_OAUTH_CLIENT_ID:-}
      MS_OAUTH_CLIENT_SECRET: ${MS_OAUTH_CLIENT_SECRET:-}
      MS_OAUTH_REDIRECT_URI: http://localhost:3000/api/v1/integrations/onenote/callback

  mcp-notes:
    build:
      context: .
      dockerfile: Dockerfile
    image: cortex:dev
    command: ["node", "--enable-source-maps", "dist/mcp/server/notes/server.js"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      PORT: "3010"
      LOG_LEVEL: info
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB_APP: cortex
      MCP_NOTES_HOST: 0.0.0.0
      MCP_NOTES_PORT: "3010"
      MCP_NOTES_PATH: /mcp
      MCP_NOTES_AUTH_TOKEN: ${MCP_NOTES_AUTH_TOKEN:-dev_mcp_notes_token_change_me}
      MCP_GATEWAY_ASSERTION_SECRET: ${MCP_GATEWAY_ASSERTION_SECRET:-dev_mcp_gateway_assertion_change_me}
      APP_PUBLIC_URL: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      QDRANT_URL: http://qdrant:6333
    ports:
      - "3010:3010"

volumes:
  mongodb_data:
  qdrant_data:
