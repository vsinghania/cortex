services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cortex:dev
    command: ["node", "dist/web-server/server.js"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp-notes:
        condition: service_started
    environment:
      PORT: "3000"
      LOG_LEVEL: info
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB_APP: cortex
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_secret_change_me}
      ACCESS_TOKEN_TTL_SEC: "900"
      REFRESH_TOKEN_TTL_SEC: "604800"
      REFRESH_COOKIE_NAME: rt
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      AUTH_RATE_LIMIT_WINDOW_MS: "900000"
      AUTH_RATE_LIMIT_MAX: "60"
      BCRYPT_SALT_ROUNDS: "12"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DEFAULT_MODEL: gpt-5.4-nano
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      QDRANT_URL: http://qdrant:6333
      RAG_TOP_K: "8"
      RAG_ANSWER_MODEL: gpt-5.4-nano
      CHUNK_TARGET_TOKENS: "512"
      CHUNK_OVERLAP_TOKENS: "64"
      MCP_NOTES_HOST: mcp-notes
      MCP_NOTES_PORT: "3010"
      MCP_NOTES_PATH: /mcp
      MCP_NOTES_AUTH_TOKEN: ${MCP_NOTES_AUTH_TOKEN:-dev_mcp_notes_token_change_me}
      MCP_NOTES_INTERNAL_URL: http://mcp-notes:3010/mcp
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-alloy}
      VOICE_MCP_PUBLIC_URL: ${VOICE_MCP_PUBLIC_URL:-}
    ports:
      - "3000:3000"

  mcp-notes:
    build:
      context: .
      dockerfile: Dockerfile
    image: cortex:dev
    command: ["node", "dist/mcp/server/notes/server.js"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      PORT: "3010"
      LOG_LEVEL: info
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB_APP: cortex
      MCP_NOTES_HOST: 0.0.0.0
      MCP_NOTES_PORT: "3010"
      MCP_NOTES_PATH: /mcp
      MCP_NOTES_AUTH_TOKEN: ${MCP_NOTES_AUTH_TOKEN:-dev_mcp_notes_token_change_me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      QDRANT_URL: http://qdrant:6333
    ports:
      - "3010:3010"

volumes:
  mongodb_data:
  qdrant_data:
