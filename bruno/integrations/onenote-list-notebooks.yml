info:
  name: onenote-list-notebooks
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/integrations/onenote/notebooks?refresh=0"
  params:
    - name: refresh
      value: "0"
      type: query
  auth: inherit

docs: |-
  Served from the server's cached list unless `refresh=1`, which re-reads from Microsoft.
  Each notebook carries its own sync state: `last_synced_at`, and `last_error` /
  `consecutive_failures` when its last pass failed.

runtime:
  scripts:
    - type: after-response
      code: |-
        // Saves the first notebook so select-notebooks and a scoped sync can be run
        // straight after this, without copying an id by hand.
        const body = res.getBody();
        const notebooks = body && body.response && body.response.notebooks;
        if (notebooks && notebooks.length > 0) {
          bru.setEnvVar('notebook_id', notebooks[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
