info:
  name: onenote-status
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/integrations/onenote/status"
  auth: inherit

docs: |-
  Whether OneNote is configured on this server, the connection if there is one, and the
  most recent sync - running or finished. `last_sync` is what lets a reloaded page rejoin
  a run in flight, and what keeps a failure visible afterwards.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
