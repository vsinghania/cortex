info:
  name: pin-note
  type: http
  seq: 13

http:
  method: PATCH
  url: "{{base_url}}/notes/{{note_id}}"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "is_pinned": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
