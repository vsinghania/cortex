info:
  name: create-folder
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/notes/folders"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Work",
        "parent_id": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
