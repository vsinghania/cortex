info:
  name: create-agent
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/agent"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Support Agent",
        "instructions": "You are a helpful support agent for Cortex.",
        "model": "gpt-4.1-mini",
        "tool_names": [],
        "tool_agent_ids": [],
        "handoff_agent_ids": [],
        "mcp_server_ids": [],
        "instruction_policy_names": ["output_hygiene", "confidentiality", "untrusted_content", "grounding"],
        "enabled": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
