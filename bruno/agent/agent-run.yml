info:
  name: agent-run
  type: http
  seq: 6

http:
  method: POST
  url: http://{{app_host}}:{{app_port}}/api/v1/agent/run
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "agent_id": "smoke-notes-agent",
        "input": "Hey! Can you fetch my latest notes?"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
