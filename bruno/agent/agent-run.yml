info:
  name: agent-run
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/agent/run"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "agent_id": "{{agent_id}}",
        "conversation_id": "{{conversation_id}}",
        "input": "Can you update the most recent note to `This is 5 out of 5`"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
