info:
  name: update-agent
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/agent/{{agent_id}}"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "instructions": "{{instructions}}",
        "enabled": true
      }
  auth: inherit

runtime:
  variables:
    - name: instructions
      value: You are a helpful support agent for Cortex. Keep answers concise and actionable.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
