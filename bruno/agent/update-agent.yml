info:
  name: update-agent
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/agent/support-agent"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "instructions": "You are a helpful support agent for Cortex. Keep answers concise and actionable.",
        "enabled": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
