info:
  name: pin-conversation
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{base_url}}/agent/conversations/{{conversation_id}}"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "is_pinned": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
