info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "{{name}}",
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  variables:
    - name: name
      value: Vishal S1
    - name: email
      value: vishals+1@cortex.com
    - name: password
      value: Password@123

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
