info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: http://{{app_host}}:{{app_port}}/api/v1/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "vs@cortex.com",
        "password": "password123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setEnvVar('access_token', body.response.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
