info:
  name: request-verification
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/auth/email/verify/request"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

runtime:
  variables:
    - name: email
      value: vishals+1@cortex.com

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
