info:
  name: forgot-password
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/password/forgot"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

runtime:
  variables:
    - name: email
      value: user@example.com

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
