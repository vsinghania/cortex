info:
  name: reset-password
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/auth/password/reset"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{reset_token}}",
        "password": "{{new_password}}"
      }
  auth: inherit

runtime:
  variables:
    # Paste the value after #token= in the reset email's link (Mailpit locally).
    - name: reset_token
      value:
    - name: new_password
      value: Password@456

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
