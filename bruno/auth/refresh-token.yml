info:
  name: refresh-token
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/auth/refresh"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setEnvVar('access_token', body.response.access_token, { persist: true });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
