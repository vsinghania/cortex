info:
  name: refresh-token
  type: http
  seq: 2

http:
  method: POST
  url: http://{{app_host}}:{{app_port}}/api/v1/auth/refresh
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setEnvVar('access_token', body.response.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
